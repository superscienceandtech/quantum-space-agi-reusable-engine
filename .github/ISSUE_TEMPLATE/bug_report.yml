name: Bug report
description: Report a reproducible defect in the project.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, remove credentials, tokens, private data, and other sensitive information from logs and examples.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible example, including inputs where applicable.
      placeholder: |
        1. Set up ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Python version (if relevant), and project revision.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets and personal or private data before sharing.
      render: text
    validations:
      required: false
