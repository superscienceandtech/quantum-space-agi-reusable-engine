[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-space-agi-reusable-engine"
version = "0.1.0"
description = "Scientific and simulation foundation for the Quantum Space AGI educational mission-design game"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3.0",
  "pydantic>=2.0,<3.0",
  "nbformat>=5.10,<6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "nbclient>=0.10,<1.0",
  "ipykernel>=6.29,<7.0",
]
notebooks = [
  "jupyterlab>=4.0,<5.0",
  "matplotlib>=3.8,<4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
