[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-space-agi-reusable-engine"
version = "0.1.0"
description = "Scientific and simulation foundation for the Quantum Space AGI educational mission-design game"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3.0",
  "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

