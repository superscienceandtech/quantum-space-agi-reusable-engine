[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-space-agi-reusable-engine"
version = "0.1.0"
description = "Reusable classical optimization interfaces and a finite-domain baseline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
qiskit-experiment = ["qiskit==2.6.1"]

[tool.setuptools.packages.find]
where = ["src"]
